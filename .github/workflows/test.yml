name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the unit suite
        run: python3 -m unittest discover -s tests
      - name: Run the stub benchmark ($0, local mock)
        run: python3 benchmarks/run_benchmarks.py
      - name: "Guard: Muse hook script copies in sync"
        run: cmp adapters/muse/check-muse.py adapters/muse/plugin/hooks/check-muse.py
      - name: "Guard: version manifests agree"
        run: |
          python3 - <<'EOF'
          import json, re, sys
          versions = {}
          init = open("sluice/__init__.py").read()
          versions["sluice/__init__.py"] = re.search(r'__version__ = "([^"]+)"', init).group(1)
          versions["plugins/sluice/.claude-plugin/plugin.json"] = json.load(open("plugins/sluice/.claude-plugin/plugin.json"))["version"]
          versions[".claude-plugin/marketplace.json"] = json.load(open(".claude-plugin/marketplace.json"))["plugins"][0]["version"]
          versions["adapters/muse/plugin/.muse-plugin/plugin.json"] = json.load(open("adapters/muse/plugin/.muse-plugin/plugin.json"))["version"]
          print(versions)
          if len(set(versions.values())) != 1:
              print("version mismatch:", versions)
              sys.exit(1)
          EOF
